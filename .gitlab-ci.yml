stages:
  - validate

lint_automation_code:
  stage: validate
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir pyyaml jinja2
  script:
    - echo "========================================================================="
    - echo "⚡ Fluxara Core Pipeline: Validating Jinja2 & YAML Repository Integrity"
    - echo "========================================================================="
    - |
      echo "[Test] Parsing configuration variable fields..."
      python3 -c "
      import yaml, glob
      for f in ['group_vars/global.yaml']:
          with open(f, 'r') as stream:
              yaml.safe_load(stream)
      print('✅ All configuration variable templates parsed cleanly.')
      "
    - |
      echo "[Test] Compiling Jinja2 Template formatting structures..."
      python3 -c "
      import os, glob
      from jinja2 import Environment, FileSystemLoader
      env = Environment(loader=FileSystemLoader('templates'))
      for f in glob.glob('templates/*.j2'):
          env.get_template(os.path.basename(f))
      print('✅ All multi-vendor Jinja2 architecture templates compiled error-free.')
      "
  only:
    - merge_requests
    - main
