<!-- file: /opt/nornir-platform/app/templates/projects_pane.html -->
<section id="main-content-viewport" style="margin-top: 2rem;">
    <h2 style="color: var(--emerald-green); font-size: 1.25rem; font-weight: bold; margin-top: 0; margin-bottom: 1.5rem;">
        Source Controlled Projects // GitLab Sync Workspaces
    </h2>

    <table>
        <thead>
            <tr>
                <th>Project ID</th>
                <th>GitLab Repository URI</th>
                <th>Tracking Branch</th>
                <th style="text-align: right;">Operations Management</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="font-weight: 600; color: var(--text-main);">project_100</td>
                <td style="font-family: monospace; color: var(--text-muted);">network/core-playbooks.git</td>
                <td style="font-family: monospace; color: var(--amber-orange);">main</td>
                <td style="text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <!-- HTAC Sync Action Trigger Trigger -->
                    <button hx-post="/api/v1/projects/100/sync" 
                            hx-vals='{"repo_url": "https://gitlab.local"}'
                            class="btn-submit" style="background-color: #1e293b;">
                        Sync Git Head
                    </button>
                    <!-- On-Demand Trigger Component Execution -->
                    <button hx-post="/api/v1/projects/100/execute"
                            hx-vals='{"job_type": "backup_configs", "netbox_filters": {"site": "dfw"}}'
                            class="btn-submit">
                        Run Now
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</section>
