<section id="main-content-viewport" style="margin-top: 2rem;">
    <h2 style="color: var(--emerald-green); font-size: 1.25rem; font-weight: bold; margin-top: 0; margin-bottom: 1.5rem;">Source Controlled Projects // GitLab Sync Workspaces</h2>
    <table style="width: 100%; border-collapse: collapse;">
        <thead><tr><th>Project ID</th><th>GitLab Repository URI</th><th>Tracking Branch</th><th style="text-align: right;">Operations Management</th></tr></thead>
        <tbody>
            <tr style="border-bottom: 1px solid #1e293b;">
                <td style="font-weight: 600; color: var(--text-main); padding: 1rem 0.75rem;">project_100</td>
                <td style="font-family: monospace; color: var(--text-muted); padding: 1rem 0.75rem;">network/core-playbooks.git</td>
                <td style="font-family: monospace; color: var(--amber-orange); padding: 1rem 0.75rem;">main</td>
                <td style="text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end; padding: 1rem 0.75rem;">
                    <button class="btn-submit" style="background-color: #334155;" hx-get="/projects/100/audit" hx-target="#audit-target-100" hx-trigger="click once" onclick="var t = document.getElementById('audit-row-100'); t.style.display = (t.style.display === 'none') ? 'table-row' : 'none';">View Audit Log</button>
                    <button hx-post="/api/v1/projects/100/sync" hx-vals='{"repo_url": "https://gitlab.local"}' class="btn-submit" style="background-color: #1e293b;">Sync Git Head</button>
                    <button hx-post="/api/v1/projects/100/execute" hx-vals='{"job_type": "backup_configs", "netbox_filters": {"site": "dfw"}}' class="btn-submit">Run Now</button>
                </td>
            </tr>
            <tr id="audit-row-100" style="display: none; background-color: rgba(0,0,0,0.15); border-bottom: 1px solid #1e293b;"><td colspan="4" style="padding: 1rem 1.5rem;"><div style="font-family: monospace; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600;">// ACTIVITY STREAM AUDIT TRAIL LOGS</div><div id="audit-target-100"><div style="color: var(--text-muted); font-size: 0.75rem; font-style: italic;">Streaming compliance metrics...</div></div></td></tr>
        </tbody>
    </table>
</section>
